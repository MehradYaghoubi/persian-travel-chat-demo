<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>گفت‌وگوی سفر | نسخه نمایشی</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="offer-picker.css">
  <script src="offer-picker.js" defer></script>
  <script src="chat.js" defer></script>
</head>
<body>
  <main id="ovChat">
    <section class="chat-box" aria-labelledby="title">
      <header class="chat-hdr">
        <div><h1 id="title">دستیار سفر</h1>
        <p>پیشنهادهای نمونه پرواز و هتل را در یک گفت‌وگو بررسی کنید.</p></div>
        <button id="reset" type="button">شروع دوباره</button>
      </header>
      <div class="chat-body" id="messages" role="log" aria-label="پیام‌های گفت‌وگو"></div>
      <form class="chat-foot" id="chat">
        <div class="chat-send-row"><input id="message" aria-label="پاسخ شما" autocomplete="off" maxlength="80" required>
        <button id="sendBtn" type="submit">ارسال</button></div>
      </form>
    </section>
  </main>
</body>
</html>
